name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static demo site (front end + simulated API)
        run: |
          mkdir site
          cp -r front/. site/
          mkdir site/product-images
          cp back/images/* site/product-images/
          cp demo/products.json site/
          cp demo/demo-api.js site/js/
          cp site/images/banniere.PNG site/images/banniere.png
          sed -i 's|</head>|<script src="../js/demo-api.js"></script></head>|' site/html/*.html
          echo '<!doctype html><meta charset="utf-8"><title>Kanap</title><meta http-equiv="refresh" content="0; url=html/index.html"><a href="html/index.html">Kanap</a>' > site/index.html
          cp -r api-docs site/api-docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
